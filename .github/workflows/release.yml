name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quality gate: tests must pass before any binary is published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Clippy (warnings only, non-blocking for now)
        run: cargo clippy --all-targets -- -D warnings || echo "clippy warnings present"

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            out: asislog-windows.exe
            zip: asislog-windows.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            out: asislog-linux
            zip: asislog-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/asislog.exe" "dist/${{ matrix.out }}"
          else
            cp "target/${{ matrix.target }}/release/asislog" "dist/${{ matrix.out }}"
          fi
      - name: Smoke test (--version must print and exit 0)
        shell: bash
        run: ./dist/"${{ matrix.out }}" --version | grep "AsisLog"
      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx -y
      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
      - name: Compress with UPX (--lzma)
        shell: bash
        run: upx --lzma --best "dist/${{ matrix.out }}"
      - name: Size guard (catch profile regressions)
        shell: bash
        run: |
          size=$(stat -c%s "dist/${{ matrix.out }}")
          echo "packed bytes: $size"
          test "$size" -lt 6291456 || (echo "packed binary exceeds 6 MB budget" && exit 1)
      - name: Pack ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: Compress-Archive -Path "dist/${{ matrix.out }}" -DestinationPath "dist/${{ matrix.zip }}" -Force
      - name: Pack ZIP (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: zip -j "dist/${{ matrix.zip }}" "dist/${{ matrix.out }}"
      - name: Write SHA-256 (Defender/AV verification)
        shell: bash
        run: cd dist && sha256sum "${{ matrix.out }}" "${{ matrix.zip }}" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: |
            dist/${{ matrix.out }}
            dist/${{ matrix.zip }}
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # Attach binaries to the GitHub Release when triggered by a v* tag.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
