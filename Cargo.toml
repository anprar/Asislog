[package]
name = "asislog"
version = "0.1.0"
edition = "2021"
description = "AsisLog - penampil log portabel untuk file sangat besar"
license = "MIT"

[[bin]]
name = "asislog"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
egui = "0.32"
memmap2 = "0.9"
memchr = "2.7"
aho-corasick = "1.1"
regex = "1.11"
encoding_rs = "0.8"
rfd = "0.15"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chardetng = "1"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
