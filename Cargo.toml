[package]
name = "asislog"
version = "0.1.0"
edition = "2021"
description = "AsisLog - penampil log portabel untuk file sangat besar"
license = "MIT"

[[bin]]
name = "asislog"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
egui = "0.32"
memmap2 = "0.9"
memchr = "2.7"
aho-corasick = "1.1"
regex = "1.11"
encoding_rs = "0.8"
rfd = "0.15"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chardetng = "1"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["rustls"] }
roaring = "0.11.5"
# PNG only (logo decode check): keep the tree lean, no extra codecs.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

# Portable release binary: small + fast to download, still fully optimized.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1.12"
